<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18233c"/>
      <stop offset="100%" stop-color="#0d1322"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#06b6d4" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="#070a12"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#shield-grad)" stroke="url(#bg-grad)" stroke-width="8"/>

  <!-- Shield Shape -->
  <path d="M 256 70 Q 370 70 390 170 Q 400 310 256 425 Q 112 310 122 170 Q 142 70 256 70 Z" 
        fill="#0f172a" stroke="url(#bg-grad)" stroke-width="6" filter="url(#glow)"/>

  <!-- Ball Elements -->
  <circle cx="256" cy="225" r="75" fill="#f8fafc" stroke="#3b82f6" stroke-width="5"/>
  <!-- Ball Pentagons -->
  <polygon points="256,190 280,208 271,237 241,237 232,208" fill="#0d1322"/>
  <line x1="256" y1="190" x2="256" y2="155" stroke="#0d1322" stroke-width="4"/>
  <line x1="280" y1="208" x2="310" y2="195" stroke="#0d1322" stroke-width="4"/>
  <line x1="271" y1="237" x2="295" y2="265" stroke="#0d1322" stroke-width="4"/>
  <line x1="241" y1="237" x2="217" y2="265" stroke="#0d1322" stroke-width="4"/>
  <line x1="232" y1="208" x2="202" y2="195" stroke="#0d1322" stroke-width="4"/>

  <!-- Text "JK NOOVA" -->
  <text x="256" y="345" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="38" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    JK NOOVA
  </text>
  <text x="256" y="375" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="18" fill="#06b6d4" text-anchor="middle" letter-spacing="6">
    ACADEMY
  </text>
</svg>
